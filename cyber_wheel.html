<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Wheel</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050a10; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; position: absolute; z-index: 1;}

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            z-index: 2;
        }

        #hud-top {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border: 2px solid #ff00ff;
            color: #0ff;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 20px;
            text-shadow: 0 0 5px #0ff;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
        }

        /* Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #110022, #440044, #001133); /* Fallback */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 100;
            transition: opacity 1s;
        }

        #start-overlay {
            background: rgba(0,0,0,0.85);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #0ff;
            box-shadow: 0 0 20px rgba(0,255,255,0.8);
            max-width: 600px;
        }

        h1 { font-size: 4em; margin: 0 0 10px 0; font-style: italic; text-shadow: 4px 4px 0 #ff00ff; letter-spacing: -2px; color: #0ff;}
        .btn-group { display: flex; gap: 20px; justify-content: center; margin-top: 30px; pointer-events: auto; }

        button {
            background: #220022;
            color: #0ff;
            border: 2px solid #ff00ff;
            padding: 15px 30px;
            font-size: 1.1em;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            box-shadow: 0 0 10px rgba(255,0,255,0.5);
        }
        button:hover { background: #440044; border-color: #0ff; color: #fff; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,255,255,0.8); }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(0,255,255,0.7);
            font-family: monospace;
            text-shadow: 1px 1px 0 #000;
            font-size: 14px;
        }

        #speed-bar-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 20px;
            border: 2px solid #0ff;
            background: rgba(0,0,0,0.5);
            box-shadow: 0 0 10px #0ff;
        }

        #speed-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00f, #f0f);
            transition: width 0.1s;
        }

        .scanline {
            width: 100%;
            height: 100%;
            position: absolute;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            z-index: 50;
            opacity: 0.3;
        }
    </style>
</head>
<body>

    <div class="scanline"></div>
    <div id="canvas-container"></div>

    <div id="ui-layer" style="display:none;">
        <div id="hud-top">
            <div id="score">SCORE: 0</div>
            <div id="speed">SPEED: 0 MPH</div>
        </div>

        <div id="speed-bar-container">
            <div id="speed-bar"></div>
        </div>

        <div class="controls-hint">
            [A][D] Steer | [W] Accelerate | [S] Brake
        </div>
    </div>

    <div id="start-screen">
        <div id="start-overlay">
            <h1>CYBER WHEEL</h1>
            <p style="font-size: 1.2em; color: #f0f;">SYNTHWAVE PURSUIT</p>
            <p style="font-size: 0.9em; color: #888; margin-bottom: 20px;">Dodge obstacles and outrun the grid.</p>

            <div class="btn-group">
                <button onclick="startGame()">START ENGINE</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, clock;
        let road, car, obstacles = [];
        let score = 0, speed = 0, maxSpeed = 150;
        let isPlaying = false;
        let roadOffset = 0;

        const keys = { w: false, a: false, s: false, d: false };

        function init() {
            clock = new THREE.Clock();

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000022, 0.005);
            scene.background = new THREE.Color(0x000011);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            // Lighting
            const ambient = new THREE.AmbientLight(0xff00ff, 0.5);
            scene.add(ambient);
            const dir = new THREE.DirectionalLight(0x00ffff, 1);
            dir.position.set(0, 10, -10);
            scene.add(dir);

            // Sun
            const sunGeo = new THREE.CircleGeometry(50, 32);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xff0088, side: THREE.DoubleSide });
            const sun = new THREE.Mesh(sunGeo, sunMat);
            sun.position.set(0, 20, -300);
            scene.add(sun);

            // Grid Ground
            const gridHelper = new THREE.GridHelper(400, 40, 0xff00ff, 0x00ffff);
            gridHelper.position.y = -1;
            scene.add(gridHelper);

            // Player Car
            const carGeo = new THREE.BoxGeometry(2, 1, 4);
            const carMat = new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0x00ffff, wireframe: true });
            car = new THREE.Mesh(carGeo, carMat);
            scene.add(car);

            window.addEventListener('resize', onResize);
            document.addEventListener('keydown', (e) => {
                if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
                if (e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
                if (e.key === 'w' || e.key === 'ArrowUp') keys.w = true;
                if (e.key === 's' || e.key === 'ArrowDown') keys.s = true;
            });
            document.addEventListener('keyup', (e) => {
                if (e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
                if (e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
                if (e.key === 'w' || e.key === 'ArrowUp') keys.w = false;
                if (e.key === 's' || e.key === 'ArrowDown') keys.s = false;
            });

            animate();
        }

        window.startGame = function() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'flex';
            isPlaying = true;
            score = 0;
            speed = 50;
            car.position.x = 0;
            obstacles.forEach(o => scene.remove(o));
            obstacles = [];
        }

        function spawnObstacle() {
            const size = Math.random() * 2 + 1;
            const geo = new THREE.BoxGeometry(size, size, size);
            const mat = new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true });
            const obs = new THREE.Mesh(geo, mat);
            obs.position.set((Math.random() - 0.5) * 40, size/2 - 1, -200);
            scene.add(obs);
            obstacles.push(obs);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isPlaying) {
                renderer.render(scene, camera);
                return;
            }

            const dt = clock.getDelta();

            // Movement logic
            if (keys.w) speed += 20 * dt;
            if (keys.s) speed -= 40 * dt;
            speed = Math.max(20, Math.min(speed, maxSpeed));

            if (keys.a) car.position.x -= 15 * dt;
            if (keys.d) car.position.x += 15 * dt;
            car.position.x = Math.max(-20, Math.min(car.position.x, 20));

            // Camera follow
            camera.position.x = car.position.x * 0.5;

            // Update UI
            score += speed * dt * 0.1;
            document.getElementById('score').innerText = 'SCORE: ' + Math.floor(score);
            document.getElementById('speed').innerText = 'SPEED: ' + Math.floor(speed) + ' MPH';
            document.getElementById('speed-bar').style.width = (speed/maxSpeed)*100 + '%';

            // Obstacles
            if (Math.random() < 0.05 + (speed/500)) {
                spawnObstacle();
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += speed * dt;

                // Collision
                const dx = Math.abs(car.position.x - obs.position.x);
                const dz = Math.abs(car.position.z - obs.position.z);
                if (dx < 2 && dz < 2) {
                    gameOver();
                }

                if (obs.position.z > 10) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            // Grid animation (moving floor)
            scene.children.forEach(child => {
                if (child.type === "GridHelper") {
                     roadOffset = (roadOffset + speed * dt) % 10;
                     child.position.z = roadOffset;
                }
            });

            renderer.render(scene, camera);
        }

        function gameOver() {
            isPlaying = false;
            if (window.parent && window.parent.cyberWheelGameOver) {
                window.parent.cyberWheelGameOver(Math.floor(score));
            } else {
                alert('GAME OVER! Score: ' + Math.floor(score));
                startGame();
            }
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
